[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rw-creature-pet"
version = "0.1.0"
description = "Rain World desktop pets: WhiteLizard and Oracle"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "UnityPy>=1.25,<2", "numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
speedups = ["numba>=0.61,<0.66"]
build = ["PyInstaller>=6.22,<7"]

[project.gui-scripts]
rw-creature-pet = "rw_creature_pet.app:main"
bell-pet = "rw_creature_pet.app:bell_main"

[tool.setuptools.packages.find]
include = ["rw_creature_pet*"]

[tool.setuptools.package-data]
rw_creature_pet = ["ico/*.png", "translations/*.qm", "translations/*.ts"]
