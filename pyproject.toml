[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rw-creature-pet"
version = "0.1.0"
description = "Rain World desktop pets: WhiteLizard and Oracle"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "UnityPy>=1.25,<2"]

[project.gui-scripts]
rw-creature-pet = "rw_creature_pet.app:main"

[tool.setuptools.packages.find]
include = ["rw_creature_pet*"]
