# 内置行为风格草稿 v1
# 设置 > 行为读取此表；选择风格时填入参数，不会自动修改已保存角色
# 名称、说明、顺序和参数可调整；改名保留 id，新增风格使用新的 id
# 每个 values 块包含该维度的完整参数，带点的字段路径必须保留引号
# 概率与幅度用 0～1，秒为真实时间，距离为逻辑像素，速度沿用现有配置单位
# 七个维度不能相互覆盖；跨边归日常活动，语音来源/音量与珍珠数量不属于此库
# 同步扑腾与双手交替是不同参数；所有风格继续受运动范围和资源可用性约束
# 本地实验或新增风格请使用旁边的 local.toml，修改方式见 README.md

format_version = 1

