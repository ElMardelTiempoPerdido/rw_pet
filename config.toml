[oracle.custom_appearance]
chest_width = 12.0            # 胸肩最宽处的完整宽度，8～18 逻辑像素
chest_height = 8.0            # 胸部中心至胸肩最高点，4～10 逻辑像素
shoulder_width = 8.0          # 左右袖根参考点之间的完整距离，4～18 逻辑像素，独立于胸肩宽度
head_length = 1.0              # 存储比例 0.7～1.5；设置面板换算为逻辑像素，默认约 10.1px
sleeve_root_width = 6.0        # 袖根完整宽度，2～12 逻辑像素
sleeve_cuff_width = 10.0       # 袖口完整宽度，2～16 逻辑像素
robe_length = 1.0              # 下半部存储比例 0.7～1.5；面板显示中央领口至下摆长度，默认约 27.6px
robe_flare = 1.0               # 下摆张开程度，0～2；1 为原轮廓，0 为不向外展开
robe_hem_curve = 1.0           # 底边弯曲程度，0～2；1 为原弧度，0 为平底，不随长度拉伸
sleeve_cuff_radius = 2.0       # 袖口圆角半径，0～4 逻辑像素；0 为直角，实际半径受袖宽与袖长限制
neck_width = 3.0               # 颈部完整宽度，1～8 逻辑像素
inner_robe_enabled = true      # 自定义内搭，关闭后露出皮肤
inner_collar_enabled = true    # 内搭高领，关闭后保留平领口内搭
inner_collar_height = 3.0      # 高领高度，0～8 逻辑像素
inner_collar_top_width = 3.0   # 高领上口完整宽度，1～24 逻辑像素
inner_collar_bottom_width = 4.0 # 高领下口完整宽度，1～24 逻辑像素
neckline_shape = 'v'           # 外层衣袍领口：arc 弧形 / v 型
neckline_width = 7.6           # 领口完整宽度，2～18 逻辑像素
neckline_depth = 6.0           # 从起始高度向下的深度，0～16 逻辑像素
neckline_height = 3.5          # 起始高度相对胸部中心，正值向头部、负值向下摆，-6～8 逻辑像素
neckline_roundness = 0.55      # 弧形圆润度，0～1；越大越接近 U 形
neckline_tip_radius = 0.0      # V 型尖端圆角，0～4 逻辑像素；0 为尖角
neckline_trim_enabled = true  # 单色领边装饰，使用 oracle.custom_colors.collar_trim
neckline_trim_width = 2.0     # 领边宽度，0～6 逻辑像素；0 不绘制
neckline_trim_gap = 0.0       # 与实际开口的间隔，0～6 逻辑像素；0 包边，>0 襟线

# 正面排列为眼睛1、眼睛2；编号随头部固定，转头或旋转不交换
# 斗篷：自定义迭代器专用，长度为自然下垂时的逻辑像素
