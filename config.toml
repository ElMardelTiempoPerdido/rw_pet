# 从此游戏目录读取主图集，缓存写入用户目录
game_dir = 'D:\steam\steamapps\common\Rain World'

[ui]
language = 'auto'               # 首次按系统界面语言选择，保存后固定为 zh / en

[desktop]
scale = 1.0                    # 桌宠显示大小：1 / 1.5 / 2 / 3 / 4
autonomous = true              # 允许人偶自主活动
screen = ''                    # 空值自动选择主屏；在设置→移动中选择后保存设备身份

[interaction]
drag_enabled = true             # 启用鼠标拖动
hover_radius = 160.0            # 鼠标邻近停留半径，逻辑像素
hover_dwell_seconds = 1.5        # 在范围内连续停留多久后抽签
hover_avoidance_enabled = true # 注视一阵后可能缓慢侧身或短距离躲避
hover_probability = 0.60        # 每轮停留面向鼠标的概率；0 关闭
hover_open_probability = 0.25   # 开始注视鼠标时睁眼的概率

[audio]
enabled = true                  # 启用语音
volume = 0.70                   # 语音音量

[debug]
tick_rate = 40
world_width = 480.0
world_height = 240.0
floor_y = 180.0

# 迭代器调试用
[oracle]
body_appearance = 'bell'        # bell 手势之铃 / custom 自定义迭代器 / prince 固定特殊角色
outfit = 'normal'               # normal 常规 / maid 女仆套装
hide_cords = false              # 隐藏粗细线缆并停止其物理计算；保留机械臂
glow_enabled = false            # 不透明部件的外发光
glow_color = '#a1a6ab'          # 外发光颜色
glow_radius = 6.0               # 外发光半径，逻辑像素
glow_opacity = 0.4              # 外发光不透明度，0 隐藏，1 为完整强度
voice = 'bell'                 # 当前角色使用的语音：bell / none（不使用语音）
voice_directory = 'auto'        # 首次从 game_dir 提取和处理，缓存至用户目录；也可填写自定义 WAV 目录
world_width = 960.0
world_height = 600.0
edge_fraction = 0.20
base_side = 'top'
allowed_edges = ['top', 'right', 'bottom', 'left'] # 活动边缘须连续，且包含启动边缘
base_fraction = 0.50
arm_scale = 0.60                # 原作臂段长度的 60%；设置 → 屏幕可调整 35%～75%
float_speed = 1.6               # 通常移动速度
drift_speed = 1.0               # 反重力漫游速度
base_speed = 2.8                # 机械臂底座沿边框滑动的速度
cross_edge_probability = 0.05   # 跨到相邻边的概率
antigravity_probability = 0.08  # 进入反重力漫游的概率
antigravity_duration_seconds = 300.0
pearl_follow_width = 360.0      # 珍珠跟随矩形的完整宽度，逻辑像素
pearl_follow_height = 280.0     # 珍珠跟随矩形的完整高度，逻辑像素
pearl_matrix_enabled = true
pearl_matrix_count = 7          # 0～64；原版 14
pearl_matrix_avoid_radius = 80.0 # 人偶自主选点时避让矩阵的半径；0 关闭
pearl_playback_probability = 0.25 # 召近阅读时触发无声播放动画的概率
pearl_bubble_max_size = 12.0    # 播放光泡最大直径，6～64 逻辑像素；最小直径保持 6px
pearl_bubble_color = '#ff0000'  # 播放光泡颜色；透明度仍由强度、首尾淡出及投影不透明度决定
pearl_orbits_enabled = true
pearl_inner_count = 4           # 0～32；原版内圈为 6
pearl_outer_count = 2           # 0～32；原版外圈为 2
pearl_fixed_count = 2           # 0～32；原版完整房间有 11 颗，包含卫星母珠
pearl_satellite_count = 1       # 0～32；原版有 5 颗。固定珠为 0 时不生成卫星
projection_opacity = 0.5        # 投影不透明度：0 隐藏，0.5 半透明，1 完全不透明
drag_projection_probability = 0.20  # 摆手结束后的空闲反应选择概率；0 关闭扫描投影
drag_projection_cooldown_seconds = 45.0  # 触发后冷却秒数，松手/再次抓取不清零
halo_enabled = true             # 圆环与短条光环
halo_scale = 0.8                # 光环相对原版的缩放
halo_arcs_enabled = true        # 低频连接附近工作区边框的电弧
halo_arc_max_count = 10         # 数量上限可选 1～10；手动与自动均随机，邻边合计最多上限的一半（向下取整）
coarse_pixels_4x = false        # 仅 4×：使用 1× 像素放大；关闭时使用 2× 像素，3× 固定使用 1×
pixel_mode = 'adaptive'         # adaptive：大倍率缩放时精细像素 / classic：放大原始像素（比较狗啃锯齿

# 设置面板中的参数均在本文件列出；未列出的高级参数使用代码默认值。
# 升级时只补齐用户配置缺少的字段，已有值不会被本文件覆盖。
