# 从此游戏目录读取主图集，缓存写入用户目录
game_dir = 'D:\steam\steamapps\common\Rain World'

[ui]
language = 'auto'               # 首次按系统界面语言选择，保存后固定为 zh / en

[desktop]
scale = 1.0                    # 桌宠显示大小：1 / 1.5 / 2
autonomous = true              # 允许人偶自主活动

[interaction]
drag_enabled = true             # 启用鼠标拖动

[audio]
enabled = true                  # 启用语音
volume = 0.70                   # 语音音量

[debug]
tick_rate = 40
world_width = 480.0
world_height = 240.0
floor_y = 180.0

# 迭代器调试用
[oracle]
hide_cords = false              # 隐藏粗细线缆并停止其物理计算；保留机械臂
glow_enabled = false            # 不透明部件的外发光
glow_color = '#ffffff'
glow_radius = 2.0               # 外发光半径，逻辑像素
voice_directory = 'auto'        # 首次从 game_dir 提取和处理，缓存至用户目录；也可填写自定义 WAV 目录
world_width = 960.0
world_height = 600.0
edge_fraction = 0.20
base_side = 'top'
allowed_edges = ['top', 'right', 'bottom', 'left'] # 活动边缘须连续，且包含启动边缘
base_fraction = 0.50
arm_scale = 0.60
float_speed = 1.6               # 通常移动速度
drift_speed = 1.0               # 反重力漫游速度
cross_edge_probability = 0.05   # 跨到相邻边的概率
antigravity_probability = 0.08  # 进入反重力漫游的概率
antigravity_duration_seconds = 300.0
pearl_matrix_enabled = true
pearl_matrix_count = 7          # 0～64；原版 14
pearl_matrix_avoid_radius = 80.0 # 人偶自主选点时避让矩阵的半径；0 关闭
pearl_playback_probability = 0.25 # 召近阅读时触发无声播放动画的概率
pearl_bubble_max_size = 12.0    # 播放光泡最大直径，6～64 逻辑像素；最小直径保持 6px
pearl_bubble_color = '#ff0000'  # 播放光泡颜色；透明度仍由强度、首尾淡出及投影不透明度决定
pearl_orbits_enabled = true
pearl_inner_count = 4           # 0～32；原版内圈为 6
pearl_outer_count = 2           # 0～32；原版外圈为 2
pearl_fixed_count = 2           # 0～32；原版完整房间有 11 颗，包含卫星母珠
pearl_satellite_count = 1       # 0～32；原版有 5 颗。固定珠为 0 时不生成卫星
projection_opacity = 0.5        # 投影不透明度：0 隐藏，0.5 半透明，1 完全不透明
halo_enabled = true             # 圆环与短条光环
halo_scale = 0.8                # 光环相对原版的缩放
halo_arcs_enabled = true        # 低频连接附近工作区边框的电弧
halo_arc_max_count = 10         # 数量上限可选 1～10；手动与自动均随机，邻边合计最多上限的一半（向下取整）
pixel_mode = 'adaptive'         # adaptive：大倍率缩放时精细像素 / classic：放大原始像素（比较狗啃锯齿

# 设置面板中的参数均在本文件列出；未列出的高级参数使用代码默认值。
# 升级时只补齐用户配置缺少的字段，已有值不会被本文件覆盖。
[oracle.colors]
skin = '#478ca1'                # 肤色
eyes = '#211920'                # 眼睛
head_shell = '#969ca1'          # 头部附件底色
head_highlight = '#c2c7ca'      # 头部附件高光
robe_top = '#ff6569'            # 衣袍上部和袖子
robe_bottom = '#d2373b'         # 衣袍下部
arm = '#6b6765'                 # 机械臂主体
arm_highlight = '#d1c9c5'       # 机械臂高光
joints = '#424c5d'              # 机械关节和底座
third_eye = '#0d5885'           # 额头标记
pearl = '#d8cdc5'               # 珍珠白色
pearl_primary = '#024866'       # 珍珠主色
pearl_secondary = '#ff2c07'     # 珍珠辅色

[oracle.drag_reactions]
enabled = true
gesture_probability = 0.90      # 鼠标拖动时触发反应的概率
flutter_probability = 0.85      # 双手动作占比
alternating_probability = 0.47  # 双手动作中固定交替摆手占比
eye_open_probability = 0.65     # 鼠标拖动时睁眼的概率
voice_probability = 0.55        # 鼠标拖动时触发语音概率

[overseer]
enabled = false                # 允许在桌面或 Oracle 调试场景自动出现；可在桌面设置中开启
check_interval = 120.0           # 空闲且冷却结束后，每隔这些秒检查一次
appearance_probability = 0.85   # 每次检查的概率，不是每帧概率
duration_min = 120.0             # 每次事件持续时间（秒），包含中途避让隐藏
duration_max = 480.0
cooldown_min = 60.0             # 完成退场后抽取冷却（秒），随后再等一个检查间隔
cooldown_max = 120.0
color = '#ff557f'               # 监视者主色；调试面板可以临时预览其他颜色
size = 0.8
withdraw_distance = 60.0        # 距离固定根部的逻辑像素；进入此范围缩回
reemerge_distance = 100.0       # 离开更大范围，并持续安全后才再次探出
puppet_withdraw_distance = 100.0 # 人偶躯干中心到根部的距离，粗略覆盖整个身体
puppet_reemerge_distance = 150.0 # 人偶也需离开更大的安全范围
relocation_probability = 0.5    # 完整避让缩回后换位的概率；每次避让只抽签一次
safe_delay = 0.45               # 连续安全等待（秒）
emerge_seconds = 0.5            # 探出的主要动作时长，末段平滑收敛
withdraw_seconds = 0.25         # 缩回的主要动作时长
