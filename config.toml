[overseer]
# 最多 4 个固定编号槽位；size 为体型 0.5～1；filament_count 为普通触须数量 3～5，朋友？固定两条
appearance_mode = "random" # random 随机出现；resident 常驻
slots = [{ id = 1, color = "#ff557f", appearance = "standard", size = 0.8, filament_count = 4 }]
enabled = false                     # 允许在桌面或调试场景自动出现
check_interval = 120.0              # 空闲且冷却结束后，每隔这些秒检查一次
appearance_probability = 0.85       # 每次检查的概率
duration_min = 120.0                # 每次事件持续时间（秒），包含中途避让隐藏
duration_max = 480.0
cooldown_min = 60.0                 # 完成退场后抽取冷却（秒），随后再等一个检查间隔
cooldown_max = 120.0
size = 0.8                         # 旧配置省略槽位体型时沿用；新增槽位的初始体型
withdraw_distance = 60.0            # 距离固定根部的逻辑像素，进入此范围缩回
reemerge_distance = 100.0           # 离开更大范围，并持续安全后才再次探出
puppet_withdraw_distance = 100.0    # 人偶躯干中心到根部的距离，粗略覆盖整个身体
puppet_reemerge_distance = 150.0    # 人偶也需离开更大的安全范围
relocation_probability = 0.5        # 完整避让缩回后换位的概率；每次避让只抽签一次
observation_probability = 0.35      # 完全探出并有鼠标目标时，每次检查展开镜片的概率；0 为关闭
observation_interval = 12.0         # 观察检查间隔（秒），观察结束合拢后重新计时
safe_delay = 0.45                   # 连续安全等待（秒）
emerge_seconds = 0.5                # 探出的主要动作时长，末段平滑收敛
withdraw_seconds = 0.25             # 缩回的主要动作时长

# 日常活动；时间为秒，距离为逻辑像素，权重只比较相对大小
[oracle.daily_activity]
