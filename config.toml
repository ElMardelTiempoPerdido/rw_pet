idle_max_seconds = 6.0
long_idle_min_seconds = 7.5
long_idle_max_seconds = 18.0
move_min_distance = 60.0
move_max_distance = 160.0
idle_weight = 28.0
move_weight = 35.0
meditate_weight = 12.0
meditate_min_seconds = 30.0
meditate_max_seconds = 60.0
cross_edge_cooldown_seconds = 60.0
