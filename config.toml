layer = 'before_sleeves'
enabled = true
offset_x = 0.0
offset_y = 0.0
mirror = false
hue = 0.0
saturation = 0.0
brightness = 0.0

[oracle.outfit_settings.maid.ribbon_up]
anchor = 'head_crown'
layer = 'front_head'
enabled = true
offset_x = 0.0
offset_y = 0.0
mirror = false
hue = 0.0
saturation = 0.0
brightness = 0.0

[oracle.outfit_settings.maid.ribbon_down]
anchor = 'gown_collar'
layer = 'front'
enabled = true
offset_x = 0.0
offset_y = 0.0
mirror = false
hue = 0.0
