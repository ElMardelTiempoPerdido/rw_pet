effect = "related"
option = "maid"
notes = "按启用部件和密度检查，不因一张未使用贴图缺失就禁用整个套装；角色是否支持套装另由能力系统决定"
[settings.maid_components]
title = "套装部件开关"
paths = ["oracle.outfit_settings.maid.head.enabled", "oracle.outfit_settings.maid.lace.enabled", "oracle.outfit_settings.maid.apron.enabled", "oracle.outfit_settings.maid.ribbon_up.enabled", "oracle.outfit_settings.maid.ribbon_down.enabled"]
features = ["maid"]
effect = "related"
notes = "部件的偏移、色调、图层等参数共用相应贴图，没有额外资源需求"
[settings.custom_images]
title = "自定义贴图路径"
paths = [
  "oracle.custom_appearance.face.image_path", "oracle.custom_appearance.forehead.image_path",
  "oracle.custom_appearance.ear_body.image_path", "oracle.custom_appearance.ear_part_1.image_path",
  "oracle.custom_appearance.ear_part_2.image_path", "oracle.custom_appearance.ear_part_3.image_path",
  "oracle.custom_appearance.clothing_decal_1.image_path", "oracle.custom_appearance.clothing_decal_2.image_path",
  "oracle.custom_appearance.clothing_decal_3.image_path",
  "oracle.custom_appearance.soft_part_1.image_path", "oracle.custom_appearance.soft_part_2.image_path",
]
features = ["custom_images"]
effect = "related"
notes = "逐槽报告错误；保留选择、替换贴图的入口；对应部件的开关和变换参数没有额外资源需求"
