# effect=unavailable 允许以后按素材结果标注该控件/选项
# effect=related 只提供关联说明，不能自动禁用整个控件
# mode=any 表示任一关联功能可用时，共用参数仍然有意义
[settings.game_directory]
title = "游戏目录"
paths = ["game_dir"]
features = ["lizard_visuals", "oracle_visuals", "overseer_standard", "pearl_glyphs", "scan_projection", "voice_bell"]
effect = "related"
notes = "缺失时仍应允许用户操作此输入框修正路径"
[settings.voice_bell]
title = "使用的语音 - bell"
paths = ["oracle.voice"]
features = ["voice_bell"]
effect = "unavailable"
option = "bell"
[settings.voice_none]
title = "使用的语音 - 不使用语音"
paths = ["oracle.voice"]
features = ["voice_none"]
effect = "unavailable"
option = "none"
[settings.voice_controls]
title = "语音开关、音量与拖动触发概率"
paths = ["audio.enabled", "audio.volume", "oracle.drag_reactions.voice_probability"]
features = ["voice_bell"]
effect = "related"
notes = "应按当前选择的语音判断，不硬编码 Watcher；未来新增语音后扩充此关联"
[settings.voice_directory]
title = "Bell 语音覆盖目录（配置文件项）"
paths = ["oracle.voice_directory"]
features = ["voice_bell"]
effect = "related"
[settings.drag_reactions]
title = "拖动互动总开关"
paths = ["oracle.drag_reactions.enabled"]
features = ["drag_reactions", "voice_bell", "scan_projection"]
effect = "related"
notes = "素材缺失不能关闭摆手与睁眼等计算动作"
[settings.scan_projection]
title = "扫描投影概率与冷却"
paths = ["oracle.drag_projection_probability", "oracle.drag_projection_cooldown_seconds"]
features = ["scan_projection"]
effect = "unavailable"
[settings.projection_opacity]
title = "投影不透明度"
paths = ["oracle.projection_opacity"]
features = ["pearl_glyphs", "scan_projection", "pearl_playback", "halo"]
effect = "unavailable"
mode = "any"
[settings.pearl_glyph_colors]
title = "珍珠字符颜色"
paths = ["oracle.colors.pearl_glyph", "oracle.custom_colors.pearl_glyph", "oracle.prince_colors.pearl_glyph"]
features = ["pearl_glyphs"]
effect = "unavailable"
[settings.pearl_playback]
title = "珍珠播放概率、气泡大小及颜色"
paths = ["oracle.pearl_playback_probability", "oracle.pearl_bubble_max_size", "oracle.pearl_bubble_color"]
features = ["pearl_playback"]
effect = "unavailable"
[settings.pearl_layout]
title = "珍珠矩阵、环绕、固定珠、卫星珠与普通阅读"
paths = ["oracle.pearl_matrix_enabled", "oracle.pearl_matrix_count", "oracle.pearl_orbits_enabled", "oracle.pearl_inner_count", "oracle.pearl_outer_count", "oracle.pearl_fixed_count", "oracle.pearl_satellite_count", "oracle.pearl_follow_width", "oracle.pearl_follow_height", "oracle.pearl_matrix_avoid_radius", "oracle.reading.start_probability"]
features = ["pearls"]
effect = "related"
notes = "缺字符投影或播放曲线不应关闭这些功能"
[settings.halo]
title = "光环尺寸及电弧"
paths = ["oracle.halo_enabled", "oracle.halo_scale", "oracle.halo_arcs_enabled", "oracle.halo_arc_max_count"]
features = ["halo"]
effect = "unavailable"
[settings.prince]
title = "主体外观 - Prince"
paths = ["oracle.body_appearance"]
features = ["prince"]
effect = "unavailable"
option = "prince"
[settings.friend]
title = "监视者槽位外观 - 朋友？"
paths = ["overseer.slots[].appearance"]
features = ["friend"]
effect = "unavailable"
option = "friend"
[settings.overseer_standard]
title = "监视者槽位外观 - 普通"
paths = ["overseer.slots[].appearance"]
features = ["overseer_standard"]
effect = "unavailable"
option = "standard"
[settings.maid]
title = "套装 - 女仆"
paths = ["oracle.outfit"]
