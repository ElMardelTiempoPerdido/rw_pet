# 保存此文件后，review_prince_tentacles.py 的窗口自动刷新
# 所有位置、长宽均为 1x 逻辑像素；颜色为 #RRGGBB
version = 1

[motion]
# 身体定位点距工作区边缘的默认距离，1x 逻辑像素；启动、重置和拖拽松手归位共用
# 受当前活动带与导航可达范围限制；设置过大时会收回到允许范围
body_edge_distance =96

[preview]
size = [280, 420]        # 画布宽高
origin = [42, 250]       # 三条触手共用原点在画布中的位置
background = "#FFFFFF"
scale = 3               # 桌宠倍率：1 / 1.5 / 2 / 3 / 4
coarse_pixels_4x = true  # 4x 时以 1x 的像素块放大，false 则以 2x 为基础
magnify = 1             # 额外观察放大，不改变像素化密度
show_prince = true
back_offset = [0, 4]    # 静态预览中触手原点位于胸部中轴下方
gaze = [-0.75, 0.05]    # 头部朝向，x 左负右正，y 低头负抬头正

# 三条主体按列表顺序从后往前绘制，随后绘制全部 bumps，最后绘制全部 cores
# length：物理链的自然长度，直接修改此值，无需缩放 points
# root_directions：根部伸出方向；grip_directions：寻找抓点偏好方向
# top/right/bottom/left 分别对应人偶所在边，各向量均为屏幕坐标 [x, y]
# x 右正左负，y 下正上负；[1, 1] 与 [2, 2] 方向相同，不影响力度；不能为 [0, 0]
# grip_reach：四边各自的寻找抓点偏好距离 / length，范围 0～1；也可填一个数值供四边共用
# 跨角时方向和距离平滑过渡；偏好位置会投影到允许的边缘，移动时仍逐条换点
# points：静态布局草案，自动平滑经过各点；运行时仅保留第一个点的根部偏移
# 未配置 length 或方向表时，仍可从 points 推导对应默认值
# widths / colors：[沿曲线的比例 0～1, 宽度或颜色]，须从 0 开始到 1 结束
# smoothness：0～1，越大越圆滑；0 为折线，不改变 points 的位置
# bumps / cores 完全独立；每行可复制增加，或增加 enabled = false 暂时隐藏
# s：沿曲线的弧长比例，0 为根部，1 为末端
# offset：沿曲线法线的偏移；向上行进时，正值朝右
# width：横跨触手的直径，height：沿触手的直径，相等即圆形
# angle：相对上述方向的顺时针旋转角度
# bumps 不写 color 时沿用主体当地渐变；cores 不写 color 时使用 core_color

